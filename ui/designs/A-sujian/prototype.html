<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>37QAG 界面原型 · A 素笺</title>
<style>
/* ══════════════════════════════════════════════════════════════
   A · 素笺 —— 宣纸白 + 墨字 + 朱砂印 + 靛青批注
   设计 token 与 ui/style.css 同名（--bg/--bg-2/--bg-3/--accent…），
   后续接入只需把这组值搬进「自定义主题」通道。
   本文件为静态设计原型：只覆盖 会话 / 设置 两个视图。
   ══════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;
  --bg: #f7f3ea;            /* 宣纸底 */
  --bg-2: #fffcf5;          /* 信笺卡片 */
  --bg-3: #efe8d9;          /* 输入槽 / 沉底 */
  --border: #e4dac8;
  --border-soft: #ece3d2;
  --text: #2b2724;          /* 墨 */
  --muted: #6e655a;
  --faint: #a09383;
  --accent: #b3423a;        /* 朱砂 */
  --accent-soft: rgba(179, 66, 58, .08);
  --tool-accent: #33608c;   /* 靛青批注 */
  --tool-soft: rgba(51, 96, 140, .08);
  --green: #4a7a52;         /* 竹青 */
  --green-soft: rgba(74, 122, 82, .1);
  --red: #b3423a;
  --shadow-sm: 0 1px 2px rgba(84, 66, 42, .06);
  --shadow-md: 0 3px 12px rgba(84, 66, 42, .08);
  --radius-sm: 6px;
  --radius-md: 10px;
  --font-serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", "PingFang SC", "Microsoft YaHei", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
::selection { background: rgba(179, 66, 58, .18); }

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #ddd2bd; border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* ── 应用骨架 ─────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; min-width: 1060px; }

/* ── 顶栏 ─────────────────────────────────────────── */
.topbar {
  height: 46px; flex: none;
  display: flex; align-items: center; gap: 14px;
  padding: 0 10px 0 16px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 9px; flex: none; }
.brand-seal {
  width: 27px; height: 27px; border-radius: 6px;
  background: var(--accent); color: #fff8ef;
  display: grid; place-items: center;
  font-family: var(--font-serif); font-size: 15px; font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(255, 248, 239, .28), var(--shadow-sm);
  user-select: none;
}
.brand-name { font-family: var(--font-serif); font-size: 16px; font-weight: 700; letter-spacing: .04em; }
.brand-tag {
  font-size: 10.5px; color: var(--accent); border: 1px solid rgba(179, 66, 58, .35);
  padding: 1.5px 7px; border-radius: 999px; letter-spacing: .12em;
  background: var(--accent-soft);
}
.top-status { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; overflow: hidden; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  height: 26px; padding: 0 10px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--border-soft);
  font-size: 11.5px; color: var(--muted); box-shadow: var(--shadow-sm);
  white-space: nowrap;
}
.chip b { color: var(--text); font-weight: 600; }
.chip .chip-label { color: var(--faint); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot-on { background: var(--green); box-shadow: 0 0 0 2.5px var(--green-soft); }
.dot-warn { background: var(--accent); box-shadow: 0 0 0 2.5px var(--accent-soft); }
.top-actions { display: flex; align-items: center; gap: 7px; flex: none; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center; color: var(--muted);
  border: 1px solid transparent;
}
.icon-btn:hover { background: var(--bg-3); color: var(--text); }
.btn {
  height: 28px; padding: 0 13px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-2);
  font-size: 12px; color: var(--text); box-shadow: var(--shadow-sm);
  white-space: nowrap;
}
.btn:hover { border-color: #d6c9ae; background: var(--bg); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff8ef; }
.btn-primary:hover { background: #a03a33; }
.btn-small { height: 25px; padding: 0 10px; font-size: 11.5px; }
.more-menu { position: relative; }
.more-menu summary {
  list-style: none; height: 30px; padding: 0 11px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--muted); font-size: 12px; cursor: pointer;
}
.more-menu summary::-webkit-details-marker { display: none; }
.more-menu summary:hover { background: var(--bg-3); color: var(--text); }
.more-popover {
  position: absolute; right: 0; top: 36px; z-index: 40;
  min-width: 148px; padding: 5px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-md);
  display: flex; flex-direction: column; gap: 1px;
}
.more-popover button {
  text-align: left; padding: 7px 11px; border-radius: 7px; font-size: 12.5px;
}
.more-popover button:hover { background: var(--bg-3); }
.win-controls { display: flex; align-items: center; gap: 2px; flex: none; margin-left: 2px; }
.win-btn { width: 34px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--faint); }
.win-btn:hover { background: var(--bg-3); color: var(--text); }
.win-btn.close:hover { background: var(--accent); color: #fff8ef; }

/* ── 标签页 ───────────────────────────────────────── */
.tabs {
  height: 42px; flex: none; display: flex; align-items: stretch; gap: 2px;
  padding: 0 12px; background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.tab {
  position: relative; padding: 0 12px; font-size: 13px; color: var(--muted);
  display: flex; align-items: center; border-radius: 7px 7px 0 0;
}
.tab:hover { color: var(--text); background: rgba(43, 39, 36, .03); }
.tab.is-active { color: var(--text); font-weight: 600; }
.tab.is-active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2.5px;
  background: var(--accent); border-radius: 2px;
}
.tab-dim { color: var(--faint); }
.tab-gap { width: 14px; flex: none; }
.tab-spacer { flex: 1; }
.nav-state {
  display: flex; align-items: center; gap: 7px; align-self: center;
  font-size: 11.5px; color: var(--muted); padding-right: 4px; white-space: nowrap;
}

/* ── 主布局 ───────────────────────────────────────── */
.layout { flex: 1; display: flex; min-height: 0; }
.view { display: none; flex: 1; min-width: 0; }
.view.is-active { display: flex; }

/* ── 会话视图 ─────────────────────────────────────── */
.list-pane {
  width: 330px; flex: none; display: flex; flex-direction: column;
  background: var(--bg-2); border-right: 1px solid var(--border);
}
.list-head { padding: 12px 12px 9px; border-bottom: 1px solid var(--border-soft); }
.list-title { font-size: 11px; color: var(--faint); letter-spacing: .18em; margin-bottom: 7px; }
.search-row { display: flex; gap: 7px; margin-bottom: 8px; }
.search-box {
  flex: 1; display: flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 10px; border-radius: 8px;
  background: var(--bg-3); border: 1px solid var(--border-soft);
}
.search-box:focus-within { border-color: var(--accent); background: var(--bg-2); }
.search-box svg { color: var(--faint); flex: none; }
.search-box input { flex: 1; border: none; outline: none; background: transparent; font-size: 12.5px; }
.search-box input::placeholder { color: var(--faint); }
.filter-select {
  height: 30px; border-radius: 8px; padding: 0 7px;
  background: var(--bg-3); border: 1px solid var(--border-soft); font-size: 12px; color: var(--muted);
}
.filter-row { display: flex; gap: 6px; align-items: center; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg-2); }
.seg button { padding: 4.5px 11px; font-size: 11.5px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border-soft); }
.seg button.is-on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.session-count { margin-left: auto; font-size: 11px; color: var(--faint); }
.session-list { flex: 1; overflow-y: auto; padding: 7px; }
.session-item {
  position: relative; padding: 9px 11px 8px 14px; border-radius: 9px; cursor: pointer;
  border: 1px solid transparent; margin-bottom: 3px;
}
.session-item:hover { background: var(--bg); border-color: var(--border-soft); }
.session-item.is-selected { background: var(--bg); border-color: var(--border); box-shadow: var(--shadow-sm); }
.session-item.is-selected::before {
  content: ""; position: absolute; left: 4px; top: 9px; bottom: 8px; width: 3px;
  border-radius: 3px; background: var(--accent);
}
.si-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2.5px; }
.si-chat { font-weight: 600; font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.si-time { font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
.si-trigger {
  font-size: 12px; color: var(--muted); margin-bottom: 6px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.si-meta { display: flex; align-items: center; gap: 8px; }
.si-num { font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.list-empty { padding: 42px 20px; text-align: center; color: var(--faint); font-size: 12px; line-height: 2; }
.list-more { padding: 9px; text-align: center; font-size: 11px; color: var(--faint); border-top: 1px dashed var(--border-soft); }

/* 状态徽章 */
.badge {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  height: 19px; padding: 0 8px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  border: 1px solid; white-space: nowrap;
}
.st-done { color: var(--green); border-color: rgba(74, 122, 82, .35); background: var(--green-soft); }
.st-running { color: var(--tool-accent); border-color: rgba(51, 96, 140, .35); background: var(--tool-soft); }
.st-running .dot { animation: pulse 1.6s ease infinite; }
.st-waiting { color: var(--muted); border-color: var(--border); background: var(--bg-3); }
.st-error { color: var(--red); border-color: rgba(179, 66, 58, .4); background: var(--accent-soft); }
.st-noreply { color: var(--faint); border-color: var(--border-soft); background: var(--bg-3); }
.badge .dot { width: 5.5px; height: 5.5px; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

/* ── 详情面板（信笺） ─────────────────────────────── */
.detail-pane { flex: 1; overflow-y: auto; min-width: 0; position: relative; background: var(--bg); }
.detail-pane::before {  /* 朱丝栏 */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: repeating-linear-gradient(90deg, rgba(179, 66, 58, .045) 0 1px, transparent 1px 34px);
  background-attachment: local;
}
.detail-inner { max-width: 760px; margin: 0 auto; padding: 26px 34px 48px; position: relative; }
.empty-hint { padding-top: 17vh; text-align: center; }
.empty-seal {
  width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 12px;
  border: 1.5px solid rgba(179, 66, 58, .45); color: rgba(179, 66, 58, .75);
  display: grid; place-items: center; background: var(--accent-soft);
}
.empty-hint h3 { font-family: var(--font-serif); font-size: 17px; font-weight: 600; letter-spacing: .2em; margin-bottom: 8px; }
.empty-hint p { color: var(--faint); font-size: 12px; letter-spacing: .05em; }

.detail-head { margin-bottom: 14px; }
.detail-head h2 {
  font-family: var(--font-serif); font-size: 19px; font-weight: 700; letter-spacing: .03em;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.detail-sub { margin-top: 6px; font-size: 11.5px; color: var(--faint); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.date-sep {
  display: flex; align-items: center; gap: 14px; margin: 20px 0 18px;
  font-size: 11px; color: var(--faint); letter-spacing: .3em;
}
.date-sep::before, .date-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }

/* 折叠面板 */
.coll {
  background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--radius-md);
  margin-bottom: 10px; box-shadow: var(--shadow-sm); overflow: hidden;
}
.coll summary {
  list-style: none; cursor: pointer; padding: 9.5px 14px;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
  display: flex; align-items: center; gap: 8px; user-select: none;
}
.coll summary::-webkit-details-marker { display: none; }
.coll summary::before {
  content: ""; width: 0; height: 0; border-left: 4.5px solid var(--faint);
  border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent;
  transition: transform .15s ease; flex: none;
}
.coll[open] summary::before { transform: rotate(90deg); }
.coll summary:hover { color: var(--text); }
.coll-body { padding: 2px 14px 12px; border-top: 1px dashed var(--border-soft); }
.kv { display: flex; gap: 12px; padding: 6.5px 0; font-size: 12px; border-bottom: 1px dashed var(--border-soft); }
.kv:last-child { border-bottom: none; }
.kv > span { flex: none; width: 64px; color: var(--faint); }
.kv > div { color: var(--muted); flex: 1; line-height: 1.65; word-break: break-all; }
.kv .num { font-variant-numeric: tabular-nums; }

/* 消息流 */
.msg-flow { display: flex; flex-direction: column; gap: 12px; }
.msg-input {
  background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--radius-md);
  padding: 10px 14px; font-size: 13px; line-height: 1.75; color: var(--text);
  box-shadow: var(--shadow-sm);
}
.flow-tag {
  display: inline-block; font-size: 10px; letter-spacing: .18em; color: var(--faint);
  margin-bottom: 5px; font-weight: 600;
}
.tool-card {
  border: 1px solid var(--border-soft); border-left: 3px solid var(--tool-accent);
  border-radius: var(--radius-sm); background: var(--bg-2);
  padding: 9px 13px; box-shadow: var(--shadow-sm);
}
.tool-card.is-error { border-left-color: var(--red); }
.tc-head { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
.tc-name { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--tool-accent); }
.tool-card.is-error .tc-name { color: var(--red); }
.tc-ms { font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.tc-ok { color: var(--green); font-size: 10.5px; }
.tc-bad { color: var(--red); font-size: 10.5px; }
.tc-args, .tc-result {
  font-family: var(--mono); font-size: 11.5px; line-height: 1.7;
  background: var(--bg-3); border-radius: 5px; padding: 7px 10px;
  white-space: pre-wrap; word-break: break-all; color: var(--muted);
}
.tc-result { margin-top: 5px; color: var(--text); }
.tc-result.is-error { color: var(--red); }
.tc-running { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tool-accent); }
.spinner {
  width: 12px; height: 12px; flex: none; border-radius: 50%;
  border: 2px solid var(--tool-soft); border-top-color: var(--tool-accent);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.msg-reply {
  background: var(--bg-2); border: 1px solid var(--border-soft);
  border-radius: 2px var(--radius-md) var(--radius-md) 2px;
  padding: 13px 17px; box-shadow: var(--shadow-sm);
}
.msg-reply .mr-text {
  font-family: var(--font-serif); font-size: 14.5px; line-height: 2; color: var(--text);
  letter-spacing: .01em;
}
.msg-sent { display: flex; flex-direction: column; align-items: flex-start; }
.ms-bubble {
  background: var(--green-soft); border: 1px solid rgba(74, 122, 82, .28);
  border-radius: 2px var(--radius-md) var(--radius-md) 2px;
  padding: 10px 15px; font-size: 13px; line-height: 1.85; max-width: 620px;
}
.ms-meta { margin-top: 5px; font-size: 10.5px; color: var(--faint); padding-left: 4px; letter-spacing: .04em; }
.wait-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-2); border: 1px dashed var(--border); border-radius: var(--radius-md);
  padding: 14px 17px; color: var(--muted); font-size: 12.5px;
}
.wait-card .num { font-family: var(--mono); color: var(--accent); font-size: 15px; font-weight: 700; }
.review-card {
  border: 1px solid rgba(179, 66, 58, .4); background: var(--accent-soft);
  border-radius: var(--radius-md); padding: 12px 16px; font-size: 12.5px; line-height: 1.85; color: #7c352f;
}
.review-card .flow-tag { color: var(--red); }

/* ── 设置视图 ─────────────────────────────────────── */
.settings-sidebar {
  width: 218px; flex: none; background: var(--bg-2);
  border-right: 1px solid var(--border); overflow-y: auto;
  padding: 12px 9px; display: flex; flex-direction: column; gap: 14px;
}
.runstate { border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 11px 12px; box-shadow: var(--shadow-sm); }
.runstate-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; margin-bottom: 7px; }
.runstate-meta { font-size: 11px; color: var(--faint); line-height: 1.9; }
.runstate .btn { margin-top: 9px; width: 100%; }
.menu-group { display: flex; flex-direction: column; gap: 2px; }
.menu-label { font-size: 10.5px; color: var(--faint); letter-spacing: .2em; padding: 0 8px 5px; }
.menu-item {
  position: relative; text-align: left; padding: 6.5px 8px 6.5px 11px; border-radius: 8px;
  font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px;
}
.menu-item:hover { background: var(--bg); color: var(--text); }
.menu-item.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.menu-item.is-active::before {
  content: ""; position: absolute; left: 3px; top: 8px; bottom: 8px; width: 2.5px;
  border-radius: 2px; background: var(--accent);
}
.settings-pane { flex: 1; overflow-y: auto; min-width: 0; background: var(--bg); }
.settings-inner { max-width: 720px; margin: 0 auto; padding: 24px 34px 56px; }
.settings-title { font-family: var(--font-serif); font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: .04em; }
.settings-sub { font-size: 12px; color: var(--faint); margin-bottom: 18px; }
.settings-block {
  background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: var(--radius-md);
  padding: 15px 17px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
}
.block-title {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-serif); font-size: 14px; font-weight: 700; margin-bottom: 12px;
}
.block-title::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); flex: none; }
.block-hint { font-size: 11.5px; color: var(--faint); line-height: 1.8; margin-top: 10px; }
.block-hint code { font-family: var(--mono); font-size: 10.5px; background: var(--bg-3); padding: 1px 5px; border-radius: 4px; }

/* 主题预设卡 */
.theme-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 10px; }
.theme-card {
  text-align: left; border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--bg); padding: 11px 12px; position: relative;
  display: flex; flex-direction: column; gap: 8px; transition: transform .12s ease, box-shadow .12s ease;
}
.theme-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.theme-card.is-current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-md); }
.theme-dots { display: flex; gap: 4px; }
.theme-dots i { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(43, 39, 36, .12); }
.theme-name { font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.theme-desc { font-size: 10.5px; color: var(--faint); line-height: 1.5; }
.theme-now {
  position: absolute; top: 9px; right: 9px; font-size: 9.5px; color: var(--accent);
  border: 1px solid rgba(179, 66, 58, .4); background: var(--accent-soft);

}
/* 单选排 */
.radio-row { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-pill {
  border: 1px solid var(--border); border-radius: 999px; padding: 5.5px 14px;

}
.radio-pill:hover { border-color: #d6c9ae; color: var(--text); }
.radio-pill.is-on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }

/* 色板 */
.swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.swatch { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border-soft); }
.swatch i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(43, 39, 36, .14); flex: none; }
.swatch .sw-key { font-size: 11.5px; color: var(--muted); flex: 1; }
.swatch .sw-val { font-family: var(--mono); font-size: 10px; color: var(--faint); }

/* 滑杆 / 开关 / 表单 */
.form-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.form-row > label { flex: none; width: 108px; font-size: 12.5px; color: var(--muted); }
.form-row .ctl { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.range-val { font-family: var(--mono); font-size: 11.5px; color: var(--accent); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { flex: 1; -webkit-appearance: none; height: 22px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: var(--border); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; margin-top: -6px;
  background: var(--bg-2); border: 2px solid var(--accent); box-shadow: var(--shadow-sm);
}
.text-input, .select-input {
  height: 30px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); padding: 0 10px; font-size: 12.5px; width: 100%;
}
.text-input:focus, .select-input:focus { outline: none; border-color: var(--accent); }
.switch { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--bg-3); border: 1px solid var(--border); transition: background .15s ease; flex: none; }
.switch::after {
  content: ""; position: absolute; top: 1.5px; left: 2px; width: 15px; height: 15px;
  border-radius: 50%; background: var(--bg-2); border: 1px solid var(--border);
  box-shadow: var(--shadow-sm); transition: transform .16s ease;
}
.switch[aria-checked="true"] { background: var(--accent-soft); border-color: rgba(179, 66, 58, .5); }
.switch[aria-checked="true"]::after { transform: translateX(15px); background: var(--accent); border-color: var(--accent); }
.settings-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
pre.code {
  font-family: var(--mono); font-size: 11px; line-height: 1.75;
  background: var(--bg-3); border: 1px solid var(--border-soft); border-radius: 8px;
  padding: 11px 13px; overflow: auto; max-height: 230px; color: var(--muted);
}
pre.code .k { color: var(--tool-accent); }
pre.code .s { color: var(--accent); }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
  background: var(--text); color: var(--bg-2); font-size: 12.5px;
  padding: 9px 18px; border-radius: 999px; box-shadow: var(--shadow-md);

}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

const STATUS_LABEL = { waiting: '等待中', done: '已发言', noreply: '未回复', running: '运行中', error: '出错', aborted: '中止' };
const state = { tab: 'sessions', filter: 'all', chat: '', search: '', selected: null, section: 'desktop', paused: false, elapsed: 12, wait: 252 };

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ── toast ── */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-toast]');
  if (el) toast(el.dataset.toast);
});

/* ── 会话列表 ── */
function badge(status) {
  const dot = status === 'running' ? '<span class="dot" style="background:currentColor"></span>' : '';
  return `<span class="badge st-${status}">${dot}${STATUS_LABEL[status] || status}</span>`;
}
function visibleSessions() {
  return SESSIONS.filter((s) => {
    if (state.filter === 'noreply' && s.status !== 'noreply') return false;
    if (state.filter === 'error' && s.status !== 'error') return false;
    if (state.chat && s.chatKey !== state.chat) return false;
    const q = state.search.trim().toLowerCase();
    if (q && !(s.chat + ' ' + s.chatKey + ' ' + s.trigger).toLowerCase().includes(q)) return false;
    return true;
  });
}
function renderSessionList() {
  const box = $('#session-items');
  const list = visibleSessions();
  $('#session-count').textContent = `${list.length} 个会话`;
  if (!list.length) {
    box.innerHTML = '<div class="list-empty">没有符合条件的会话<br />换个筛选或搜索词试试</div>';
    return;
  }
  box.innerHTML = list.map((s) => {
    const wait = s.status === 'waiting' ? `<span class="si-num" data-wait>${fmtWait(state.wait)}</span>` : '';
    const run = s.status === 'running' ? `<span class="si-num" style="color:var(--tool-accent)" data-elapsed>已等 ${fmtSec(state.elapsed)}</span>` : '';
    return `
    <div class="session-item ${s.id === state.selected ? 'is-selected' : ''}" data-id="${s.id}" role="button" tabindex="0"
         aria-label="${esc(s.chat)} · ${STATUS_LABEL[s.status]}">
      <div class="si-top"><span class="si-chat">${esc(s.chat)}</span><span class="si-time">${esc(s.time)}</span></div>
      <div class="si-trigger">${esc(s.trigger)}</div>
      <div class="si-meta">${badge(s.status)}
        <span class="si-num">${esc(s.tokens)} tok</span>
        ${s.rounds ? `<span class="si-num">${s.rounds} 轮工具</span>` : ''}
        ${s.search ? `<span class="si-num">搜 ${s.search}</span>` : ''}
        ${wait}${run}
      </div>
    </div>`;
  }).join('');
  $$('.session-item', box).forEach((el) => {
    el.addEventListener('click', () => selectSession(el.dataset.id));
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSession(el.dataset.id); } });
  });
}
function fmtSec(n) { return n < 60 ? `${n}s` : `${Math.floor(n / 60)}分${String(n % 60).padStart(2, '0')}`; }
function fmtWait(n) { return `冷却 ${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`; }

function selectSession(id) {
  state.selected = id;
  renderSessionList();
  renderDetail();
}

/* ── 会话详情（聊天主界面） ── */
function flowItem(f) {
  if (f.t === 'input') return `<div class="msg-input"><span class="flow-tag">输入</span>${esc(f.text)}</div>`;
  if (f.t === 'tool') return `
    <div class="tool-card">
      <div class="tc-head"><span class="tc-name">${esc(f.name)}</span><span class="tc-ok">✓ ${f.ms}ms</span></div>
      <pre class="tc-args">${esc(f.args)}</pre>
      <pre class="tc-result">${esc(f.result)}</pre>
    </div>`;
  if (f.t === 'tool-err') return `
    <div class="tool-card is-error">
      <div class="tc-head"><span class="tc-name">${esc(f.name)}</span><span class="tc-bad">✕ 失败 · ${f.ms}ms</span></div>
      <pre class="tc-args">${esc(f.args)}</pre>
      <pre class="tc-result is-error">${esc(f.result)}</pre>
    </div>`;
  if (f.t === 'tool-run') return `
    <div class="tool-card">
      <div class="tc-head"><span class="tc-name">${esc(f.name)}</span><span class="tc-ms">运行中</span></div>
      <div class="tc-running"><span class="spinner" aria-hidden="true"></span>${esc(f.text)}</div>
    </div>`;
  if (f.t === 'reply') return `<div class="msg-reply"><span class="flow-tag">回复草稿</span><div class="mr-text">${esc(f.text)}</div></div>`;
  if (f.t === 'sent') return `<div class="msg-sent"><span class="flow-tag">已发送</span><div class="ms-bubble">${esc(f.text)}</div><div class="ms-meta">${esc(f.time)}</div></div>`;
  return '';
}
function renderDetail() {
  const box = $('#session-detail');
  const s = SESSIONS.find((x) => x.id === state.selected);
  if (!s) {
    box.innerHTML = `
      <div class="detail-inner">
        <div class="empty-hint">
          <div class="empty-seal" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 19l7-7-4.5-4.5a3.2 3.2 0 00-4.5 0L9 8.5m3 10.5l-3-3m3 3v-2M6 21h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <h3>择一会话 · 展笺细览</h3>
          <p>在左侧选中一条会话，查看回复草稿与运行过程</p>
        </div>
      </div>`;
    return;
  }
  const d = s.detail;
  const waiting = s.status === 'waiting' ? `
    <div class="wait-card">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.8V8l2.1 1.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      会话冷却中 —— 距可回复还有 <span class="num" id="wait-num">${fmtWait(state.wait)}</span>（同会话两次发言的最小间隔，可在「聊天与节奏」里调整）
    </div>` : '';
  const review = s.review ? `
    <div class="review-card"><span class="flow-tag">复盘</span>${esc(s.review)}</div>` : '';
  const runNote = s.status === 'running' ? ` · <span data-elapsed style="color:var(--tool-accent)">已等 ${fmtSec(state.elapsed)}</span>` : '';
  box.innerHTML = `
    <div class="detail-inner">
      <div class="detail-head">
        <h2>${esc(s.chat)} ${badge(s.status)}</h2>
        <div class="detail-sub">${esc(s.chatKey)} · 开始 ${d.start} · 耗时 ${d.cost}${runNote} · ${d.tokFull} tok · ${d.tools}</div>
      </div>
      <details class="coll" open>
        <summary>运行详情</summary>
        <div class="coll-body">
          <div class="kv"><span>触发</span><div>${esc(s.trigger)}</div></div>
          <div class="kv"><span>模型</span><div>${MODEL} · 上下文 4 档（全读）</div></div>
          <div class="kv"><span>用量</span><div class="num">${d.tokFull} tok · 输出约 ${(parseFloat(s.tokens) * 0.18 || 0.2).toFixed(1)}k</div></div>
          <div class="kv"><span>工具</span><div>${d.tools}</div></div>
        </div>
      </details>
      ${review}
      <div class="date-sep"><span>九月廿六 · 周六</span></div>
      <div class="msg-flow">
        ${s.flow.map(flowItem).join('')}
        ${waiting}
      </div>
    </div>`;
}

/* ── 设置 ── */
const MENU = [
  ['连接', [['api', '模型 API'], ['search', '搜索服务'], ['browse', '浏览锁定'], ['onebot', 'OneBot']]],
  ['行为', [['allow', '聊天白名单'], ['chat', '聊天与节奏'], ['memory', '记忆'], ['jev', '本地 Jev'], ['persona', '人设']]],
  ['界面', [['desktop', '桌面端']]],
  ['插件', [['cmd', '指令前置'], ['games', '迷你游戏']]]
];
function renderSettingsMenu() {
  $('#settings-menu').innerHTML = MENU.map(([label, items]) => `
    <div class="menu-group">
      <div class="menu-label">${label}</div>
      ${items.map(([id, name]) => `<button class="menu-item ${state.section === id ? 'is-active' : ''}" data-section="${id}" type="button">${name}</button>`).join('')}
    </div>`).join('');
  $$('[data-section]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.section;
    if (['desktop', 'api', 'chat'].includes(id)) { state.section = id; renderSettingsMenu(); renderSettingsForm(); }
    else toast(`「${b.textContent}」分区不在本套原型范围（原型覆盖：会话 / 设置核心分区）`);
  }));
}
const THEME_CARDS = [

  { name: '深空控制台', desc: '深空蓝黑 · 冰青 · 琥珀', colors: ['#0a0f1c', '#0f1626', '#4cc9f0', '#ffb454', '#e8f2fa'] },
  { name: '暖房', desc: '奶油米 · 陶土 · 鼠尾草', colors: ['#f6eadb', '#fff8ee', '#e07a5f', '#7fa37a', '#42352b'] },
  { name: '机甲 · 黑橙', desc: '内置预设', colors: ['#0c0c0e', '#151517', '#f5a623', '#ff7a00', '#f4f4f5'] }

      </div>
      <div class="settings-block">

        </div>
        <div class="block-hint">支持 .json / .theme.txt，导入后立刻应用并写入配置（两号互通）。格式见 <code>themes/THEME_FORMAT.txt</code>。当前主题文件内容：</div>
        <pre class="code" style="margin-top:10px">${THEME_JSON_SAMPLE}</pre>

    $('#brightness').addEventListener('input', (e) => {
      const v = e.target.value;
      $('#brightness-val').textContent = v + '%';
      $('#app').style.filter = `brightness(${v / 100})`;
    });
    $('#uiscale').addEventListener('change', (e) => {
      $('#app').style.zoom = String(parseInt(e.target.value, 10) / 100);
      toast(`界面缩放：${e.target.value}`);
    });
    $('#import-btn').addEventListener('click', () => {
      toast('已解析 theme.json：format=qq-agent-theme · 8 个颜色字段全部合法 · 立即应用');
    });
    $$('[data-theme-card]').forEach((b) => b.addEventListener('click', () => {
      const name = b.dataset.themeCard;
      if (name === '素笺') toast('素笺已是当前主题');
      else if (name === '机甲 · 黑橙') toast('机甲 · 黑橙为内置预设，点击可应用（原型演示）');
      else toast(`${name}：请预览对应原型文件 ui/designs/ · theme.json 可直接导入`);
    }));
    $$('.radio-pill').forEach((b) => b.addEventListener('click', () => {
      if (b.textContent === '自定义主题') return;
      toast('本原型固定展示「素笺」自定义主题；经典主题切换不在演示范围');
    }));
  } else if (state.section === 'api') {
    box.innerHTML = `
      <div class="settings-title">模型 API</div>

        <div class="form-row"><label for="temp">随机性</label><div class="ctl"><input type="range" id="temp" min="0" max="15" value="8" /><span class="range-val" id="temp-val">0.8</span></div></div>

}

/* ── 顶栏 / 标签页 ── */
$$('.tab').forEach((t) => t.addEventListener('click', () => {
  const tab = t.dataset.tab;
  if (tab === 'sessions' || tab === 'settings') {
    state.tab = tab;
    $$('.tab').forEach((x) => x.classList.toggle('is-active', x === t));
    $$('.view').forEach((v) => v.classList.toggle('is-active', v.dataset.view === tab));
  } else {
    toast('本套原型只覆盖「会话」与「设置」两页');
  }
}));
$('#theme-btn').addEventListener('click', () => toast('本页即素笺主题；经典暗/亮切换不在原型范围'));
$('#pause-btn').addEventListener('click', () => {
  state.paused = !state.paused;
  $('#pause-btn').textContent = state.paused ? '继续' : '暂停';
  $('#run-state').textContent = state.paused ? '机器人已暂停' : '机器人运行中';
  $('#bot-state').textContent = state.paused ? '已暂停' : '精力充沛';
  $('#nav-state-text').textContent = state.paused ? '本体 · 已暂停' : '本体 · 精力充沛 · 电池 78%';
  $('#run-dot').className = 'dot ' + (state.paused ? 'dot-warn' : 'dot-on');
  $('#nav-dot').className = 'dot ' + (state.paused ? 'dot-warn' : 'dot-on');
  toast(state.paused ? '机器人已暂停（不再响应新消息）' : '机器人已继续运行');
});
function doReload() {
  toast('配置已热重载，工具已重建（原型演示）');
  $('#uptime').textContent = '0 时 0 分';
}
$('#reload-btn').addEventListener('click', doReload);
$('#hot-reload-btn').addEventListener('click', () => { $('#more-menu').removeAttribute('open'); doReload(); });

/* ── 列表筛选 ── */
$$('[data-filter]').forEach((b) => b.addEventListener('click', () => {
  state.filter = b.dataset.filter;
  $$('[data-filter]').forEach((x) => { x.classList.toggle('is-on', x === b); x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  renderSessionList();
}));
$('#session-search').addEventListener('input', (e) => { state.search = e.target.value; renderSessionList(); });

/* ── 计时器：运行中已等 N 秒 / 冷却倒计时 ── */
setInterval(() => {
  if (state.paused) return;
  state.elapsed += 1;
  $$('[data-elapsed]').forEach((el) => { el.textContent = '已等 ' + fmtSec(state.elapsed); });
  if (state.wait > 0) state.wait -= 1;
  $$('[data-wait]').forEach((el) => { el.textContent = fmtWait(Math.max(0, state.wait)); });
  const wn = $('#wait-num');
  if (wn) wn.textContent = fmtWait(Math.max(0, state.wait));
}, 1000);

/* ── 初始化 ── */
(function init() {
  const groups = [...new Set(SESSIONS.map((s) => s.chatKey))];
  $('#session-chat-filter').innerHTML = '<option value="">全部群聊与私聊</option>' + groups.map((k) => {
    const s = SESSIONS.find((x) => x.chatKey === k);
    return `<option value="${k}">${esc(s.chat)}（${k}）</option>`;
  }).join('');
  $('#session-chat-filter').addEventListener('change', (e) => { state.chat = e.target.value; renderSessionList(); });
  renderSessionList();
  renderDetail();
  renderSettingsMenu();
  renderSettingsForm();
})();
</script>
</body>
